name: CI

on:
  pull_request:
    branches:
      - test
      - main
      - 'integration/**'
  push:
    branches:
      - test
      - main
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: workflowdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-test-jwt-secret-not-for-production-0001
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: workflowdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workflowdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: warn

  frontend:
    name: Frontend / quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
