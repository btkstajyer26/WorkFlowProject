spring.application.name=WorkFlowProject

# --- Datasource (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:workflowdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

# Thymeleaf şablonlarının anında güncellenmesi için:
spring.thymeleaf.cache=false
# --- Mail (docker'da mailpit, prod'da gercek SMTP) ---
# Kimlik bilgileri ortam degiskeninden okunur; bu dosyaya parola yazilmaz.
# Mailtrap/Outlook gibi gercek bir SMTP icin ornek .env:
#   MAIL_HOST=live.smtp.mailtrap.io MAIL_PORT=587 MAIL_AUTH=true MAIL_STARTTLS=true
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Yerel mailpit kimlik dogrulamasi istemez; gercek SMTP icin MAIL_AUTH=true.
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# E-postadaki derin baglantinin isaret ettigi arayuz adresi (sartname §4.5).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Bildirim e-postalarinin gonderen adresi.
app.mail-from=${MAIL_FROM:ebys@ornek.local}

app.upload.dir=${UPLOAD_DIR:./uploads}

# --- Sifremi unuttum ---
# E-postayla gonderilen 6 haneli kodun omru.
app.password-reset.code-ttl-minutes=${PASSWORD_RESET_CODE_TTL_MINUTES:10}
# Kod dogrulandiktan sonra verilen tek kullanimlik anahtarin omru; kullanicinin
# yeni sifreyi yazmasi icin gereken sureyi kapsamali.
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:15}
# Ayni hesap icin ikinci kodun uretilebilmesi icin gecmesi gereken sure.
app.password-reset.resend-cooldown-seconds=${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}

# --- Dosya yukleme boyut siniri ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- OpenAPI / Swagger UI ---
# Arayuz: http://localhost:8080/swagger-ui.html
# Ham semasi: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Uclar HTTP metoduna gore siralanir, alfabetik karisiklik olmaz.
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- JWT ---
# Anahtar ortam degiskeninden okunur. Buradaki varsayilan YALNIZCA yerel
# gelistirme icindir; prod ortaminda JWT_SECRET mutlaka tanimlanmalidir.
jwt.secret=${JWT_SECRET:yerel-gelistirme-icin-en-az-32-karakter-uzunlugunda-gecici-anahtar}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# --- Ilk Admin (bootstrap) ---
# Varsayilan YOK: ikisi de acikca verilmezse hicbir Admin olusturulmaz.
# Buraya parola yazilmaz; deger ortam degiskeninden gelir ve ilk giriste
# degistirilmesi zorunlu kilinir.
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Firebase Cloud Messaging (mobil push bildirimleri) ---
# Servis hesabi bilgileri ortam degiskeninden okunur; bu dosyaya anahtar yazilmaz.
# Uculu birden bos birakilirsa FCM devre disi kalir ve push gonderimi atlanir.
fcm.project-id=${FCM_PROJECT_ID:}
fcm.client-email=${FCM_CLIENT_EMAIL:}
fcm.private-key=${FCM_PRIVATE_KEY:}

# --- Actuator ---
# /actuator/health kimlik dogrulamasi istemez (bkz. SecurityConfig): reverse
# proxy ve container healthcheck'i token uretemez. Uc disariya acik oldugu icin
# yalnizca health yayinlanir ve ayrinti kapali tutulur; show-details=always
# yapilirsa veritabani ve mail sunucusu bilgisi internete sizar.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Mail saglik kontrolu SMTP'ye gercekten baglanmayi dener. Acik kalirsa
# mailpit'in durmasi backend'i "unhealthy" yapar, Caddy'nin service_healthy
# kosulu hic saglanmaz ve butun ortam bir mail yakalayicisi yuzunden coker.
# Veritabani kontrolu bilerek acik: DB'siz uygulama zaten istek karsilayamaz.
management.health.mail.enabled=false
