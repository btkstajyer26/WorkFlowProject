spring.application.name=WorkFlowProject

# --- Datasource (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:workflowdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
# Şema yönetimi Flyway'e ait; Hibernate sadece entity <-> tablo uyumunu doğrular.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Mail (docker'da mailpit, prod'da Outlook SMTP) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# --- Dosya yükleme ---
app.upload.dir=${UPLOAD_DIR:./uploads}
