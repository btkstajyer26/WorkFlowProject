# --- Dosya yukleme boyut siniri ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- OpenAPI / Swagger UI ---
# Arayuz: http://localhost:8080/swagger-ui.html
# Ham semasi: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Uclar HTTP metoduna gore siralanir, alfabetik karisiklik olmaz.
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- JWT ---
# Anahtar ortam degiskeninden okunur. Buradaki varsayilan YALNIZCA yerel
# gelistirme icindir; prod ortaminda JWT_SECRET mutlaka tanimlanmalidir.
jwt.secret=${JWT_SECRET:yerel-gelistirme-icin-en-az-32-karakter-uzunlugunda-gecici-anahtar}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# --- Ilk Admin (bootstrap) ---
# Varsayilan YOK: ikisi de acikca verilmezse hicbir Admin olusturulmaz.
# Buraya parola yazilmaz; deger ortam degiskeninden gelir ve ilk giriste
# degistirilmesi zorunlu kilinir.
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
