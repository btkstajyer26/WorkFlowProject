name: ebys2-e2e

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: workflowdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflowdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:18025:8025"

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: workflowdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_FROM: ebys-e2e@ornek.local
      UPLOAD_DIR: /tmp/ebys-e2e-uploads
      JWT_SECRET: ci-only-e2e-jwt-secret-not-for-production-0002
      FRONTEND_URL: http://127.0.0.1:5174
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174
      BOOTSTRAP_ADMIN_EMAIL: e2e.admin@workflow.test
      BOOTSTRAP_ADMIN_PASSWORD: E2eAdminInitial1!
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s
