# TEST ortami overlay'i. Temel dosyayla birlikte kullanilir:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Iki isi var:
#   1. Temel dosyanin host'a yayinladigi portlari tamamen kaldirir.
#   2. Disariya bakan tek servis olarak Caddy'yi ekler (TLS sonlandirma).
#
# Temel dosyada db ve Mailpit portlari 127.0.0.1'e baglidir; backend ise mobil
# LAN gelistirmesi icin 0.0.0.0:8080 yayinlar. Bu nedenle !reset TEST'in asil
# port siniridir ve Docker Compose >= 2.24 zorunludur. Eski Compose surumunde
# devam etmeyin; once surumu yukseltin.
#
# Gerekli .env anahtarlari: TEST_DOMAIN, MAILPIT_USER, MAILPIT_PASSWORD_HASH
# (bkz. .env.example).

services:
  db:
    ports: !reset []

  mailpit:
    ports: !reset []
    environment:
      # Caddy arayuzu /mail yolundan proxy'liyor; Mailpit kendi baglantilarini
      # bu on eke gore uretmeli, yoksa arayuz kirik acilir.
      MP_WEBROOT: /mail

  backend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: workflow-caddy
    depends_on:
      backend:
        # Backend hazir olmadan proxy'lemeye baslarsa ilk istekler 502 doner.
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TEST_DOMAIN: ${TEST_DOMAIN}
      MAILPIT_USER: ${MAILPIT_USER}
      MAILPIT_PASSWORD_HASH: ${MAILPIT_PASSWORD_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikalar burada saklanir. Silinirse Let's Encrypt'ten yeniden
      # istenir ve haftalik kota (alan adi basina 5) tuketilir.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
